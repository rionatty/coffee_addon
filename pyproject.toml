[project]
name = "coffee_addon"
authors = [
    { name = "CyveTech", email = "42210367+rionatty@users.noreply.github.com"}
]
description = "Coffee processing for ERPNext: the Goods Received Note, grades and yields"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=15.0.0" # Installed and managed by bench.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "F401", # "imported but unused"
    "F403", # "unable to detect undefined names" from * import
    "F405", # "may be undefined, or defined from star imports"
    "RUF001", # string contains ambiguous unicode character
    "RUF002", # docstring contains ambiguous unicode character
    "RUF003", # comment contains ambiguous unicode character
    "RUF015", # Prefer next(iter()) over single element slice
    "UP030", # Use implicit references for positional format fields (translations)
    "UP031", # Use format specifier instead of % (translations)
    "W191", # indentation contains tabs
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
